openapi: 3.1.0
info:
  title: Arc - 未来予報 API
  version: 0.2.0
  description: 予約・決済・相談員管理 API

servers:
  - url: /api

paths:
  /organizations/{organizationId}/consultants:
    get:
      operationId: getConsultants
      summary: 相談員一覧取得
      tags: [consultant]
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [consultants]
                properties:
                  consultants:
                    type: array
                    items:
                      $ref: "#/components/schemas/Consultant"

  /organizations/{organizationId}/slots:
    get:
      operationId: getSlots
      summary: 空き枠一覧取得
      tags: [slot]
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - name: consultantId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetSlots200"
    post:
      operationId: createSlot
      summary: 空き枠作成
      tags: [slot]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consultantId, startDatetime, endDatetime]
              properties:
                consultantId:
                  type: string
                startDatetime:
                  type: string
                  format: date-time
                endDatetime:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [slotId]
                properties:
                  slotId:
                    type: string

  /organizations/{organizationId}/slots/{slotId}:
    delete:
      operationId: deleteSlot
      summary: 空き枠削除
      tags: [slot]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/SlotIdParam"
      responses:
        "200":
          description: OK

  /organizations/{organizationId}/bookings:
    post:
      operationId: createBooking
      summary: 予約作成
      tags: [booking]
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateBookingResponse"

  /organizations/{organizationId}/bookings/{bookingId}/cancel:
    post:
      operationId: cancelBooking
      summary: 予約キャンセル
      tags: [booking]
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/BookingIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cancelledBy]
              properties:
                cancelledBy:
                  type: string
                  enum: [client, admin]
                token:
                  type: string
      responses:
        "200":
          description: OK

  /organizations/{organizationId}/bookings/{bookingId}/setup-payment:
    post:
      operationId: setupPayment
      summary: 決済セットアップ
      tags: [booking]
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/BookingIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupPaymentRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupPaymentResponse"

  /organizations/{organizationId}/bookings/{bookingId}/charge:
    post:
      operationId: chargePayment
      summary: 手動課金
      tags: [booking]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/BookingIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method:
                  type: string
                  enum: [manual]
      responses:
        "200":
          description: OK

  /organizations/{organizationId}/settings/public:
    get:
      operationId: getPublicSettings
      summary: 公開設定取得
      tags: [settings]
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSettings"

  /organizations/{organizationId}/batch/charge:
    post:
      operationId: batchCharge
      summary: バッチ課金（Cloud Scheduler）
      tags: [batch]
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [chargedCount, completedCount]
                properties:
                  chargedCount:
                    type: integer
                  completedCount:
                    type: integer

  /organizations/{organizationId}/consultant/bookings:
    get:
      operationId: getConsultantBookings
      summary: 相談員予約一覧取得
      tags: [consultant]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [bookings]
                properties:
                  bookings:
                    type: array
                    items:
                      $ref: "#/components/schemas/BookingDetail"

  /organizations/{organizationId}/consultant/bookings/{id}/memo:
    patch:
      operationId: updateConsultantMemo
      summary: 相談員メモ更新
      tags: [consultant]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memo]
              properties:
                memo:
                  type: string
      responses:
        "200":
          description: OK

  /organizations/{organizationId}/consultant/profile:
    get:
      operationId: getConsultantProfile
      summary: 相談員プロフィール取得
      tags: [consultant]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultantProfile"
    patch:
      operationId: updateConsultantProfile
      summary: 相談員プロフィール更新
      tags: [consultant]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName, specialties]
              properties:
                displayName:
                  type: string
                bio:
                  type: string
                specialties:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: OK

  /organizations/{organizationId}/admin/dashboard:
    get:
      operationId: getAdminDashboard
      summary: 管理ダッシュボード取得
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardData"

  /organizations/{organizationId}/admin/consultants:
    get:
      operationId: getAdminConsultants
      summary: 相談員一覧取得（管理者）
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [consultants]
                properties:
                  consultants:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConsultantDetail"
    post:
      operationId: createAdminConsultant
      summary: 相談員作成
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consultantId, displayName]
              properties:
                consultantId:
                  type: string
                displayName:
                  type: string
                bio:
                  type: string
                specialties:
                  type: array
                  items:
                    type: string
                zoomRoomIds:
                  type: array
                  items:
                    type: string
      responses:
        "201":
          description: Created

  /organizations/{organizationId}/admin/consultants/{id}:
    patch:
      operationId: updateAdminConsultant
      summary: 相談員更新
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                bio:
                  type: string
                specialties:
                  type: array
                  items:
                    type: string
                zoomRoomIds:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: OK
    delete:
      operationId: deleteAdminConsultant
      summary: 相談員無効化
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: OK

  /organizations/{organizationId}/admin/settings/booking:
    get:
      operationId: getAdminBookingSettings
      summary: 予約設定取得（管理者・オペレーター）
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingSettings"
    patch:
      operationId: updateAdminBookingSettings
      summary: 予約設定更新（管理者のみ）
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingSettings"
      responses:
        "200":
          description: OK

  /organizations/{organizationId}/admin/bookings:
    get:
      operationId: getAdminBookings
      summary: 予約一覧取得（管理者）
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [bookings]
                properties:
                  bookings:
                    type: array
                    items:
                      $ref: "#/components/schemas/BookingDetail"

  /organizations/{organizationId}/admin/payments:
    get:
      operationId: getAdminPayments
      summary: 決済一覧取得（管理者）
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [payments]
                properties:
                  payments:
                    type: array
                    items:
                      $ref: "#/components/schemas/PaymentDetail"

  /organizations/{organizationId}/admin/clients:
    get:
      operationId: getAdminClients
      summary: クライアント一覧取得（管理者）
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [clients]
                properties:
                  clients:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClientDetail"

  /organizations/{organizationId}/admin/users:
    get:
      operationId: getAdminUsers
      summary: 組織ユーザー一覧取得（管理者・オペレーター）
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminUser"

  /organizations/{organizationId}/admin/users/invite:
    post:
      operationId: inviteUser
      summary: 組織ユーザー招待（管理者・オペレーター・相談員）
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role, displayName]
              properties:
                email:
                  type: string
                  format: email
                displayName:
                  type: string
                role:
                  type: string
                  enum: [admin, operator, consultant]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [uid]
                properties:
                  uid:
                    type: string

  /organizations/{organizationId}/admin/users/{uid}:
    delete:
      operationId: deleteAdminUser
      summary: 組織ユーザー削除
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/UserIdParam"
      responses:
        "200":
          description: OK

  /organizations/{organizationId}/admin/users/{uid}/role:
    patch:
      operationId: updateUserRole
      summary: 組織ユーザーロール更新
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/UserIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [admin, operator]
      responses:
        "200":
          description: OK

  /organizations/{organizationId}/admin/users/{uid}/display-name:
    patch:
      operationId: updateUserDisplayName
      summary: 組織ユーザー表示名更新（管理者、またはオペレーター本人）
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/UserIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName:
                  type: string
      responses:
        "200":
          description: OK

  /organizations/{organizationId}/admin/users/{uid}/resend-invite:
    post:
      operationId: resendUserInvite
      summary: 招待メール再送（管理者・オペレーター）
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/UserIdParam"
      responses:
        "200":
          description: OK

  /organizations/{organizationId}/admin/users/{uid}/reset-password:
    post:
      operationId: resetUserPassword
      summary: パスワードリセットメール送信（管理者・オペレーター）
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/UserIdParam"
      responses:
        "200":
          description: OK

components:
  parameters:
    OrganizationIdParam:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
    BookingIdParam:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
    SlotIdParam:
      name: slotId
      in: path
      required: true
      schema:
        type: string
    UserIdParam:
      name: uid
      in: path
      required: true
      schema:
        type: string
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    AdminUser:
      type: object
      required: [uid, email, displayName, role, status]
      properties:
        uid:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum: [admin, operator]
        status:
          type: string
          enum: [pending, registered]

    Consultant:
      type: object
      required: [consultantId, name, specialties, isActive]
      properties:
        consultantId:
          type: string
        name:
          type: string
        specialties:
          type: array
          items:
            type: string
        bio:
          type: string
        imageUrl:
          type: string
        isActive:
          type: boolean

    ConsultantDetail:
      type: object
      required: [consultantId, displayName, specialties, isActive]
      properties:
        consultantId:
          type: string
        email:
          type: string
        displayName:
          type: string
        bio:
          type: string
        specialties:
          type: array
          items:
            type: string
        zoomRoomIds:
          type: array
          items:
            type: string
        isActive:
          type: boolean

    ConsultantProfile:
      type: object
      required: [consultantId, displayName, specialties, isActive]
      properties:
        consultantId:
          type: string
        displayName:
          type: string
        bio:
          type: string
        specialties:
          type: array
          items:
            type: string
        zoomRoomIds:
          type: array
          items:
            type: string
        isActive:
          type: boolean

    Slot:
      type: object
      required: [slotId, consultantId, startDatetime, endDatetime, isAvailable]
      properties:
        slotId:
          type: string
        consultantId:
          type: string
        startDatetime:
          type: string
          format: date-time
        endDatetime:
          type: string
          format: date-time
        isAvailable:
          type: boolean

    AggregatedSlot:
      type: object
      required: [startDatetime, endDatetime]
      properties:
        startDatetime:
          type: string
          format: date-time
        endDatetime:
          type: string
          format: date-time

    GetSlots200:
      type: object
      properties:
        slots:
          type: array
          items:
            $ref: "#/components/schemas/Slot"
        aggregatedSlots:
          type: array
          items:
            $ref: "#/components/schemas/AggregatedSlot"

    BookingDetail:
      type: object
      required: [bookingId, clientId, consultantId, slotId, startDatetime, status]
      properties:
        bookingId:
          type: string
        clientId:
          type: string
        consultantId:
          type: string
        slotId:
          type: string
        startDatetime:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, confirmed, completed, cancelled]
        zoomUrl:
          type: string
          format: uri
          nullable: true
        consultantMemo:
          type: string
        consultationContent:
          type: string
          nullable: true

    PaymentDetail:
      type: object
      required: [paymentId, bookingId, clientId, amountJPY, taxAmountJPY, totalJPY, status, paymentStrategy]
      properties:
        paymentId:
          type: string
        bookingId:
          type: string
        clientId:
          type: string
        paymentStrategy:
          type: string
          enum: [deferred, immediate]
        stripePaymentIntentId:
          type: string
          nullable: true
        stripeSetupIntentId:
          type: string
          nullable: true
        stripePaymentMethodId:
          type: string
          nullable: true
        amountJPY:
          type: integer
        taxAmountJPY:
          type: integer
        totalJPY:
          type: integer
        status:
          type: string
          enum: [setup_pending, setup_complete, charged, refunded, cancelled, failed]
        chargeMethod:
          type: string
          enum: [batch, manual]
          nullable: true

    ClientDetail:
      type: object
      required: [clientId, name, email, phone]
      properties:
        clientId:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        memo:
          type: string
          nullable: true

    DashboardData:
      type: object
      required: [totalBookings, totalPayments, totalClients, totalConsultants, totalRevenue, bookingsByStatus]
      properties:
        totalBookings:
          type: integer
        totalPayments:
          type: integer
        totalClients:
          type: integer
        totalConsultants:
          type: integer
        totalRevenue:
          type: integer
        bookingsByStatus:
          type: object
          required: [pending, confirmed, completed, cancelled]
          properties:
            pending:
              type: integer
            confirmed:
              type: integer
            completed:
              type: integer
            cancelled:
              type: integer

    BookingSettings:
      type: object
      required: [consultantSelectionEnabled]
      properties:
        consultantSelectionEnabled:
          type: boolean

    PublicSettings:
      type: object
      required: [consultantSelectionEnabled]
      properties:
        consultantSelectionEnabled:
          type: boolean

    UpdateBookingSettingsBody:
      type: object
      required: [consultantSelectionEnabled]
      properties:
        consultantSelectionEnabled:
          type: boolean

    CreateBookingRequest:
      type: object
      properties:
        slotId:
          type: string
        startDatetime:
          type: string
          format: date-time
        endDatetime:
          type: string
          format: date-time
        clientName:
          type: string
        clientEmail:
          type: string
          format: email
        clientPhone:
          type: string
        consultantContent:
          type: string

    CreateBookingResponse:
      type: object
      required: [bookingId, zoomUrl]
      properties:
        bookingId:
          type: string
        zoomUrl:
          type: string
          format: uri

    SetupPaymentRequest:
      type: object
      required: [paymentMethodType]
      properties:
        paymentMethodType:
          type: string
          enum: [card, paypay]

    SetupPaymentResponse:
      type: object
      required: [clientSecret, mode]
      properties:
        clientSecret:
          type: string
        mode:
          type: string
          enum: [setup, payment]

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
