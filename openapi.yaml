openapi: 3.1.0
info:
  title: Arc - 未来予報 API
  version: 0.2.0
  description: 予約・決済・相談員管理 API

servers:
  - url: /api

paths:
  /consultants:
    get:
      operationId: getConsultants
      summary: 相談員一覧取得
      tags: [consultant]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [consultants]
                properties:
                  consultants:
                    type: array
                    items:
                      $ref: "#/components/schemas/Consultant"

  /slots:
    get:
      operationId: getSlots
      summary: 空き枠一覧取得
      tags: [slot]
      parameters:
        - name: consultantId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [slots]
                properties:
                  slots:
                    type: array
                    items:
                      $ref: "#/components/schemas/Slot"
    post:
      operationId: createSlot
      summary: 空き枠作成
      tags: [slot]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consultantId, startDatetime, endDatetime]
              properties:
                consultantId:
                  type: string
                startDatetime:
                  type: string
                  format: date-time
                endDatetime:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [slotId]
                properties:
                  slotId:
                    type: string
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings:
    post:
      operationId: createBooking
      summary: 予約作成
      tags: [booking]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateBookingResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings/{bookingId}/cancel:
    post:
      operationId: cancelBooking
      summary: 予約キャンセル
      tags: [booking]
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cancelledBy]
              properties:
                cancelledBy:
                  type: string
                  enum: [client, admin]
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings/{bookingId}/setup-payment:
    post:
      operationId: setupPayment
      summary: 決済セットアップ
      tags: [booking]
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupPaymentRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupPaymentResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings/{bookingId}/charge:
    post:
      operationId: chargePayment
      summary: 手動課金
      tags: [booking]
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method:
                  type: string
                  enum: [manual]
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /batch/charge:
    post:
      operationId: batchCharge
      summary: バッチ課金（Cloud Scheduler）
      tags: [batch]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [chargedCount, completedCount]
                properties:
                  chargedCount:
                    type: integer
                  completedCount:
                    type: integer

  /consultant/blocked-times:
    get:
      operationId: getConsultantBlockedTimes
      summary: 自分のブロック時間一覧取得
      tags: [consultant]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [blockedTimes]
                properties:
                  blockedTimes:
                    type: array
                    items:
                      $ref: "#/components/schemas/BlockedTime"
    post:
      operationId: createConsultantBlockedTime
      summary: ブロック時間作成
      tags: [consultant]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startDatetime, endDatetime]
              properties:
                startDatetime:
                  type: string
                  format: date-time
                endDatetime:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [blockedTimeId]
                properties:
                  blockedTimeId:
                    type: string
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /consultant/blocked-times/{blockedTimeId}:
    delete:
      operationId: deleteConsultantBlockedTime
      summary: ブロック時間削除
      tags: [consultant]
      security:
        - bearerAuth: []
      parameters:
        - name: blockedTimeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /consultant/bookings:
    get:
      operationId: getConsultantBookings
      summary: 自分の予約一覧取得
      tags: [consultant]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [bookings]
                properties:
                  bookings:
                    type: array
                    items:
                      $ref: "#/components/schemas/BookingDetail"

  /consultant/bookings/{bookingId}/memo:
    patch:
      operationId: updateConsultantMemo
      summary: メモ更新
      tags: [consultant]
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memo]
              properties:
                memo:
                  type: string
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /consultant/profile:
    get:
      operationId: getConsultantProfile
      summary: 自分のプロフィール取得
      tags: [consultant]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultantProfile"
    patch:
      operationId: updateConsultantProfile
      summary: プロフィール更新
      tags: [consultant]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName, specialties]
              properties:
                displayName:
                  type: string
                bio:
                  type: string
                specialties:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      summary: 統計情報取得
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardData"

  /admin/consultants:
    get:
      operationId: getAdminConsultants
      summary: 相談員一覧取得（管理者）
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [consultants]
                properties:
                  consultants:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConsultantDetail"
    post:
      operationId: createAdminConsultant
      summary: 相談員作成
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consultantId, displayName]
              properties:
                consultantId:
                  type: string
                displayName:
                  type: string
                bio:
                  type: string
                specialties:
                  type: array
                  items:
                    type: string
                zoomRoomIds:
                  type: array
                  items:
                    type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [consultantId]
                properties:
                  consultantId:
                    type: string

  /admin/consultants/{id}:
    patch:
      operationId: updateAdminConsultant
      summary: 相談員更新
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                bio:
                  type: string
                specialties:
                  type: array
                  items:
                    type: string
                zoomRoomIds:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: OK
    delete:
      operationId: deleteAdminConsultant
      summary: 相談員無効化
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK

  /admin/bookings:
    get:
      operationId: getAdminBookings
      summary: 全予約一覧取得
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, completed, cancelled]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [bookings]
                properties:
                  bookings:
                    type: array
                    items:
                      $ref: "#/components/schemas/BookingDetail"

  /admin/payments:
    get:
      operationId: getAdminPayments
      summary: 全決済一覧取得
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [payments]
                properties:
                  payments:
                    type: array
                    items:
                      $ref: "#/components/schemas/PaymentDetail"

  /admin/clients:
    get:
      operationId: getAdminClients
      summary: 全クライアント一覧取得
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [clients]
                properties:
                  clients:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClientDetail"

  /admin/users:
    get:
      operationId: getAdminUsers
      summary: ユーザー一覧取得（super_admin限定）
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminUser"

  /admin/users/invite:
    post:
      operationId: inviteUser
      summary: ユーザー招待（super_admin限定）
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum: [super_admin, operator, consultant]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [uid]
                properties:
                  uid:
                    type: string
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users/{uid}:
    delete:
      operationId: deleteAdminUser
      summary: ユーザー削除（super_admin限定）
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users/{uid}/role:
    patch:
      operationId: updateUserRole
      summary: ロール管理（super_admin限定）
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [super_admin, operator, consultant]
      responses:
        "200":
          description: OK

  /admin/users/{uid}/resend-invite:
    post:
      operationId: resendUserInvite
      summary: 招待メール再送（super_admin限定）
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users/{uid}/reset-password:
    post:
      operationId: resetUserPassword
      summary: パスワードリセットメール送信（super_admin限定）
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    AdminUser:
      type: object
      required: [uid, email, role, status]
      properties:
        uid:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [super_admin, operator, consultant]
        status:
          type: string
          enum: [pending, registered]

    Consultant:
      type: object
      required: [consultantId, name, specialties, isActive]
      properties:
        consultantId:
          type: string
        name:
          type: string
        specialties:
          type: array
          items:
            type: string
        bio:
          type: string
        imageUrl:
          type: string
        isActive:
          type: boolean

    ConsultantDetail:
      type: object
      required: [consultantId, displayName, specialties, isActive]
      properties:
        consultantId:
          type: string
        displayName:
          type: string
        bio:
          type: string
        specialties:
          type: array
          items:
            type: string
        zoomRoomIds:
          type: array
          items:
            type: string
        isActive:
          type: boolean

    ConsultantProfile:
      type: object
      required: [consultantId, displayName, specialties, isActive]
      properties:
        consultantId:
          type: string
        displayName:
          type: string
        bio:
          type: string
        specialties:
          type: array
          items:
            type: string
        zoomRoomIds:
          type: array
          items:
            type: string
        isActive:
          type: boolean

    BlockedTime:
      type: object
      required: [blockedTimeId, startDatetime, endDatetime]
      properties:
        blockedTimeId:
          type: string
        startDatetime:
          type: string
          format: date-time
        endDatetime:
          type: string
          format: date-time

    Slot:
      type: object
      required: [slotId, consultantId, startDatetime, endDatetime, isAvailable]
      properties:
        slotId:
          type: string
        consultantId:
          type: string
        startDatetime:
          type: string
          format: date-time
        endDatetime:
          type: string
          format: date-time
        isAvailable:
          type: boolean

    BookingDetail:
      type: object
      required: [bookingId, clientId, consultantId, slotId, startDatetime, status]
      properties:
        bookingId:
          type: string
        clientId:
          type: string
        consultantId:
          type: string
        slotId:
          type: string
        startDatetime:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, confirmed, completed, cancelled]
        zoomUrl:
          type: string
          format: uri
          nullable: true
        consultantMemo:
          type: string
        consultationContent:
          type: string
          nullable: true

    PaymentDetail:
      type: object
      required: [paymentId, bookingId, clientId, amountJPY, taxAmountJPY, totalJPY, status, paymentStrategy]
      properties:
        paymentId:
          type: string
        bookingId:
          type: string
        clientId:
          type: string
        paymentStrategy:
          type: string
          enum: [deferred, immediate]
        stripePaymentIntentId:
          type: string
          nullable: true
        stripeSetupIntentId:
          type: string
          nullable: true
        stripePaymentMethodId:
          type: string
          nullable: true
        amountJPY:
          type: integer
        taxAmountJPY:
          type: integer
        totalJPY:
          type: integer
        status:
          type: string
          enum: [setup_pending, setup_complete, charged, refunded, cancelled, failed]
        chargeMethod:
          type: string
          enum: [batch, manual]
          nullable: true

    ClientDetail:
      type: object
      required: [clientId, name, email, phone]
      properties:
        clientId:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        memo:
          type: string
          nullable: true

    DashboardData:
      type: object
      required: [totalBookings, totalPayments, totalClients, totalConsultants, totalRevenue, bookingsByStatus]
      properties:
        totalBookings:
          type: integer
        totalPayments:
          type: integer
        totalClients:
          type: integer
        totalConsultants:
          type: integer
        totalRevenue:
          type: integer
        bookingsByStatus:
          type: object
          required: [pending, confirmed, completed, cancelled]
          properties:
            pending:
              type: integer
            confirmed:
              type: integer
            completed:
              type: integer
            cancelled:
              type: integer

    CreateBookingRequest:
      type: object
      required: [slotId, clientName, clientEmail, clientPhone]
      properties:
        slotId:
          type: string
        clientName:
          type: string
        clientEmail:
          type: string
          format: email
        clientPhone:
          type: string
        consultantContent:
          type: string

    CreateBookingResponse:
      type: object
      required: [bookingId, zoomUrl]
      properties:
        bookingId:
          type: string
        zoomUrl:
          type: string
          format: uri

    SetupPaymentRequest:
      type: object
      required: [paymentMethodType]
      properties:
        paymentMethodType:
          type: string
          enum: [card, paypay]

    SetupPaymentResponse:
      type: object
      required: [clientSecret, mode]
      properties:
        clientSecret:
          type: string
        mode:
          type: string
          enum: [setup, payment]

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
