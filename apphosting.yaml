runConfig:
  concurrency: 80
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 4

env:
  # Build + Runtime（NEXT_PUBLIC_* はビルド時にインライン化されるため BUILD が必要）
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    secret: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_APP_URL
    secret: NEXT_PUBLIC_APP_URL
    availability:
      - BUILD
      - RUNTIME

  # Runtime secrets（Cloud Secret Manager 参照）
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
  - variable: ZOOM_ACCOUNT_ID
    secret: ZOOM_ACCOUNT_ID
  - variable: ZOOM_CLIENT_ID
    secret: ZOOM_CLIENT_ID
  - variable: ZOOM_CLIENT_SECRET
    secret: ZOOM_CLIENT_SECRET
  - variable: ZOOM_HOST_USER_ID
    secret: ZOOM_HOST_USER_ID
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL
  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
  - variable: CANCEL_TOKEN_SECRET
    secret: CANCEL_TOKEN_SECRET
  - variable: LINE_WORKS_LATE_ARRIVAL_WEBHOOK_URL
    secret: LINE_WORKS_LATE_ARRIVAL_WEBHOOK_URL

  # Runtime secrets（運用値も Secret Manager で管理）
  - variable: RESEND_FROM_EMAIL
    secret: RESEND_FROM_EMAIL
    availability:
      - RUNTIME
  - variable: FIREBASE_PROJECT_ID
    secret: FIREBASE_PROJECT_ID
    availability:
      - RUNTIME
  - variable: INVOICE_REGISTRATION_NUMBER
    secret: INVOICE_REGISTRATION_NUMBER
    availability:
      - RUNTIME
