name: Deploy SPA hosting

on:
  push:
    branches: [release/dev, release/prod]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-hosting-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'release/dev' && 'dev' || 'prod' }}
    env:
      DEPLOY_ENV: ${{ github.ref_name == 'release/dev' && 'dev' || 'prod' }}
      PROJECT_ID: mirai-yoho-${{ github.ref_name == 'release/dev' && 'dev' || 'prod' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/ci-setup
      - name: Build user SPA
        run: pnpm --filter @mirai-yoho/user run build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_ADMIN_APP_URL: ${{ vars.ADMIN_APP_URL }}
          VITE_CONSULTANT_APP_URL: ${{ vars.CONSULTANT_APP_URL }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.STRIPE_PUBLISHABLE_KEY }}
      - name: Build admin SPA
        run: pnpm --filter @mirai-yoho/admin run build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      - name: Build consultant SPA
        run: pnpm --filter @mirai-yoho/consultant run build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-deployer@mirai-yoho-${{ github.ref_name == 'release/dev' && 'dev' || 'prod' }}.iam.gserviceaccount.com
      - name: Deploy to Firebase Hosting
        run: |
          pnpm dlx firebase-tools deploy \
            --only hosting:user,hosting:admin,hosting:consultant \
            --project "$PROJECT_ID" \
            --non-interactive
