name: Create Release PR

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Release environment
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  pull-requests: write

# NOTE: リリース PR のマージはワークフローで自動実行しない（手動でマージする）。
# GITHUB_TOKEN による push は他ワークフローをトリガーしない GitHub Actions の仕様のため、
# 自動マージすると release/dev への push で deploy-* ワークフローが起動しなくなる。
# 自動マージを復活させる場合は GitHub App / PAT でマージする必要がある。

jobs:
  create-release-pr:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Create release pull request
        run: |
          base_branch="release/${TARGET_ENVIRONMENT}"
          existing_pr_url="$(gh pr list \
            --base "${base_branch}" \
            --head main \
            --state open \
            --json url \
            --jq '.[0].url')"

          if [ -n "${existing_pr_url}" ]; then
            echo "An open release pull request already exists: ${existing_pr_url}"
            exit 0
          fi

          gh pr create \
            --base "${base_branch}" \
            --head main \
            --title "chore: release main to ${TARGET_ENVIRONMENT}" \
            --body "Creates a release pull request from \`main\` to \`${base_branch}\`."
