name: Create Release PR

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Release environment
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Create release pull request
        run: |
          base_branch="release/${TARGET_ENVIRONMENT}"
          existing_pr_url="$(gh pr list \
            --base "${base_branch}" \
            --head main \
            --state open \
            --json url \
            --jq '.[0].url')"

          if [ -n "${existing_pr_url}" ]; then
            echo "An open release pull request already exists: ${existing_pr_url}"
            pr_url="${existing_pr_url}"
          else
            pr_url="$(gh pr create \
              --base "${base_branch}" \
              --head main \
              --title "chore: release main to ${TARGET_ENVIRONMENT}" \
              --body "Creates a release pull request from \`main\` to \`${base_branch}\`.")"
          fi

          # マージコミットで取り込む（squash/rebase だと release ブランチの
          # merge-base が進まず、次回リリース PR に既リリース分が重複表示されるため）。
          # head は main なので --delete-branch は付けない。
          gh pr merge "${pr_url}" --merge
