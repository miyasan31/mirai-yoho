name: Deploy batch worker

on:
  push:
    branches: [release/dev, release/prod]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'release/dev' && 'dev' || 'prod' }}
    env:
      DEPLOY_ENV: ${{ github.ref_name == 'release/dev' && 'dev' || 'prod' }}
      PROJECT_ID: mirai-yoho-${{ github.ref_name == 'release/dev' && 'dev' || 'prod' }}
      REGION: asia-northeast1
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-deployer@mirai-yoho-${{ github.ref_name == 'release/dev' && 'dev' || 'prod' }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
      - name: Build and push worker image
        run: |
          gcloud builds submit \
            --project="$PROJECT_ID" \
            --config=cloudbuild.worker.yaml \
            --substitutions=_IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/batch-worker/worker:$IMAGE_TAG"
      - name: Apply worker infrastructure
        working-directory: infra/terraform
        env:
          TF_VAR_worker_image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/batch-worker/worker:${{ env.IMAGE_TAG }}
        run: |
          make init ENV="$DEPLOY_ENV"
          make plan ENV="$DEPLOY_ENV"
          make apply ENV="$DEPLOY_ENV"
