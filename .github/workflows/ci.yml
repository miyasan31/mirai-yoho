name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tsc:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/ci-setup
      - name: Type check
        run: |
          pnpm tsc
          pnpm --filter @mirai-yoho/api run tsc:test

  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/ci-setup
      - name: Test
        run: pnpm test

  lint-format:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/ci-setup
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm exec biome check --formatter-enabled=true --linter-enabled=false --assist-enabled=false .

  build:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/ci-setup
      - name: Build
        run: pnpm build

  worker-docker-build:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build worker image
        run: docker build -f apps/api/Dockerfile.worker .
