name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tsc:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/ci-setup
      - name: Type check
        run: |
          pnpm tsc
          pnpm --filter @mirai-yoho/api run tsc:test

  test:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/ci-setup
      - name: Test
        run: pnpm test

  lint-format:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/ci-setup
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm exec biome check --formatter-enabled=true --linter-enabled=false --assist-enabled=false .

  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/ci-setup
      - name: Build
        run: pnpm build
        env:
          CANCEL_TOKEN_SECRET: ci-placeholder-cancel-token-secret
          VITE_API_URL: http://localhost:3000
          VITE_CONSOLE_APP_URL: http://localhost:5174
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-placeholder

  worker-docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build worker image
        run: docker build -f apps/api/Dockerfile.worker .
