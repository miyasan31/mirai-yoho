name: Deploy API

on:
  push:
    branches: [release/dev, release/prod]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-api-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: ${{ github.ref_name == 'release/dev' && 'dev' || 'prod' }}
    env:
      PROJECT_ID: mirai-yoho-${{ github.ref_name == 'release/dev' && 'dev' || 'prod' }}
      ENV_ALIAS: ${{ github.ref_name == 'release/dev' && 'dev' || 'prod' }}
      REGION: asia-northeast1
      SERVICE: api
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-deployer@mirai-yoho-${{ github.ref_name == 'release/dev' && 'dev' || 'prod' }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      # Cloud Run が参照する Secret Manager シークレットに有効な latest バージョン（値）が
      # 存在するか事前検証する。値未投入のシークレットがあると `gcloud run services update` が
      # 「Secret ... versions/latest was not found」で失敗するため、ビルド前にまとめて検出して
      # 修正手順を提示する。値は表示せず、有効バージョンの有無のみ確認する。
      # リストは terraform の api_secret_ids（infra/terraform/gcp/common/api/main.tf）と一致させる。
      - name: Verify required secrets have a value
        env:
          REQUIRED_SECRETS: >-
            API_URL USER_APP_URL CONSOLE_APP_URL CANCEL_TOKEN_SECRET
            CORS_ALLOWED_ORIGINS FIREBASE_CLIENT_EMAIL FIREBASE_PRIVATE_KEY FIREBASE_PROJECT_ID
            FIREBASE_STORAGE_BUCKET INVOICE_REGISTRATION_NUMBER LINE_WORKS_LATE_ARRIVAL_WEBHOOK_URL
            RESEND_API_KEY RESEND_FROM_EMAIL STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET
            ZOOM_ACCOUNT_ID ZOOM_CLIENT_ID ZOOM_CLIENT_SECRET ZOOM_HOST_USER_ID
            ZOOM_USER_OAUTH_CLIENT_ID ZOOM_USER_OAUTH_CLIENT_SECRET ZOOM_OAUTH_STATE_SECRET
            ZOOM_CREDENTIAL_ENCRYPTION_KEY
        run: |
          missing=""
          for secret in $REQUIRED_SECRETS; do
            enabled_version="$(gcloud secrets versions list "$secret" \
              --project "$PROJECT_ID" \
              --filter="state=ENABLED" \
              --format="value(name)" \
              --limit=1 2>/dev/null || true)"
            if [ -z "$enabled_version" ]; then
              echo "NG: $secret has no enabled version (or the secret does not exist)"
              missing="$missing $secret"
            else
              echo "OK: $secret"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Secret Manager secrets without an enabled 'latest' version in $PROJECT_ID:$missing"
            echo "Populate the value(s) before deploying, e.g.:"
            echo "  make setup-secrets-from-env:$ENV_ALIAS PROJECT=$PROJECT_ID"
            echo "  make setup-secret:$ENV_ALIAS KEY=<SECRET_NAME>"
            exit 1
          fi
      - name: Build and push API image
        run: |
          gcloud builds submit \
            --project="$PROJECT_ID" \
            --config=apps/api/cloudbuild.yaml \
            --substitutions=_IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/api/api:$IMAGE_TAG"
      # インフラ（Cloud Run service の存在・構成）は terraform-apply.yml が main への push で適用済みの想定。
      # ここでは既存 service の稼働イメージを新しいビルドに差し替えるだけ（image は terraform 管理外）。
      - name: Deploy API image to Cloud Run
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/api/api:${{ env.IMAGE_TAG }}
        run: |
          gcloud run services update "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE"
