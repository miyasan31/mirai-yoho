name: Terraform apply

# main への push で infra/terraform 配下が変更されたら apply する。
# dev は即時、prod は GitHub Environment "prod" の required reviewers による承認待ち。
# 稼働イメージ（Cloud Run job の container image）は terraform 管理外（ignore_changes）で、
# リリース時に deploy-batch-worker.yml が差し替える。
on:
  push:
    branches: [main]
    paths:
      - infra/terraform/**
      - .github/workflows/terraform-apply.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        # prod は WIF プール/プロバイダ未整備のため一旦無効化。整備後に戻す。
        environment: [dev] # [dev, prod]
    # prod 環境に required reviewers を設定しておくと、この leg のみ承認待ちになる。
    # dev leg は並行して即実行される。
    environment: ${{ matrix.environment }}
    env:
      DEPLOY_ENV: ${{ matrix.environment }}
      PROJECT_ID: mirai-yoho-${{ matrix.environment }}
      REGION: asia-northeast1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-deployer@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
      - name: Resolve worker image
        id: worker-image
        # image は ignore_changes なので既存 job には影響しないが、初回 create 時に
        # 実在するイメージを使えるよう、稼働中の image があればそれを、無ければ placeholder を渡す。
        run: |
          worker_image="$(gcloud run jobs describe batch-charge \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format 'value(template.template.containers[0].image)' 2>/dev/null || true)"
          if [ -z "$worker_image" ]; then
            worker_image="$REGION-docker.pkg.dev/$PROJECT_ID/batch-worker/worker:plan-placeholder"
            echo "No deployed batch-charge job found; using placeholder image."
          fi
          echo "worker_image=$worker_image" >> "$GITHUB_OUTPUT"
      - name: Resolve api image
        id: api-image
        # image は ignore_changes なので既存 service には影響しないが、Cloud Run service は
        # job と違い作成時に即リビジョンをデプロイするため、初回 create 時に実在＆起動する
        # イメージが必要。稼働中の image があればそれを、無ければ Cloud Run の hello サンプルを
        # ブートストラップに使う（実際のイメージは deploy-api.yml が差し替える）。
        run: |
          api_image="$(gcloud run services describe api \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format 'value(template.containers[0].image)' 2>/dev/null || true)"
          if [ -z "$api_image" ]; then
            api_image="us-docker.pkg.dev/cloudrun/container/hello:latest"
            echo "No deployed api service found; using Cloud Run hello bootstrap image."
          fi
          echo "api_image=$api_image" >> "$GITHUB_OUTPUT"
      - name: Terraform apply
        working-directory: infra/terraform/gcp
        env:
          TF_VAR_worker_image: ${{ steps.worker-image.outputs.worker_image }}
          TF_VAR_api_image: ${{ steps.api-image.outputs.api_image }}
        run: |
          make init ENV="$DEPLOY_ENV"
          make plan ENV="$DEPLOY_ENV" TF_PLAN_FLAGS="-lock-timeout=10m -input=false"
          make apply ENV="$DEPLOY_ENV" TF_APPLY_FLAGS="-auto-approve -lock-timeout=10m"
