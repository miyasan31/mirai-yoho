name: Terraform plan

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - prod
      worker_image:
        description: Worker image URI for TF_VAR_worker_image (default = currently deployed image)
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-plan-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      PROJECT_ID: mirai-yoho-${{ inputs.environment }}
      REGION: asia-northeast1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-deployer@mirai-yoho-${{ inputs.environment }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
      - name: Resolve worker image
        id: worker-image
        run: |
          worker_image="${{ inputs.worker_image }}"
          if [ -z "$worker_image" ]; then
            worker_image="$(gcloud run jobs describe batch-charge \
              --project "$PROJECT_ID" \
              --region "$REGION" \
              --format 'value(template.template.containers[0].image)' 2>/dev/null || true)"
          fi
          if [ -z "$worker_image" ]; then
            worker_image="$REGION-docker.pkg.dev/$PROJECT_ID/batch-worker/worker:plan-placeholder"
            echo "No deployed batch-charge job found; using placeholder image."
          fi
          echo "worker_image=$worker_image" >> "$GITHUB_OUTPUT"
      - name: Terraform plan
        working-directory: infra/terraform/gcp
        env:
          TF_VAR_worker_image: ${{ steps.worker-image.outputs.worker_image }}
        run: |
          make init ENV="$DEPLOY_ENV"
          make plan ENV="$DEPLOY_ENV" TF_PLAN_FLAGS="-lock-timeout=10m -input=false"
