# 未来予報 API サーバー（Next.js）のコンテナイメージをビルドして Artifact Registry に push する。
# リポジトリルートをビルドコンテキストとして実行する:
#   gcloud builds submit --config=apps/api/cloudbuild.yaml \
#     --substitutions=_IMAGE=<region>-docker.pkg.dev/<project>/api/api:<tag> .
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "apps/api/Dockerfile", "-t", "${_IMAGE}", "."]
images:
  - "${_IMAGE}"
