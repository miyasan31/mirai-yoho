          nullable: true
        agreedAt:
          type: string
          format: date-time

    PolicyAgreementStatusEntry:
      type: object
      required:
        - type
        - latestRevision
        - latestAgreedRevisionId
        - latestAgreedVersion
        - latestAgreedAt
        - latestAgreedVia
        - needsAgreement
      properties:
        type:
          $ref: "#/components/schemas/PolicyType"
        latestRevision:
          allOf:
            - $ref: "#/components/schemas/PolicyRevision"
          nullable: true
        latestAgreedRevisionId:
          type: string
          nullable: true
        latestAgreedVersion:
          type: string
          nullable: true
        latestAgreedAt:
          type: string
          format: date-time
          nullable: true
        latestAgreedVia:
          allOf:
            - $ref: "#/components/schemas/PolicyAgreementVia"
          nullable: true
        needsAgreement:
          type: boolean

    PolicyAgreementStatus:
      type: object
      required:
        - organizationId
        - subjectType
        - subjectId
        - entries
        - needsReagreement
      properties:
        organizationId:
          type: string
        subjectType:
          $ref: "#/components/schemas/PolicySubjectType"
        subjectId:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/PolicyAgreementStatusEntry"
        needsReagreement:
          type: boolean

    PolicyAgreementInput:
      type: object
      required: [items]
      properties:
        agreedVia:
          $ref: "#/components/schemas/PolicyAgreementVia"
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [type, revisionId]
            properties:
              type:
                $ref: "#/components/schemas/PolicyType"
              revisionId:
                type: string

    LatestPublishedPolicyResponse:
      type: object
      required: [revision]
      properties:
        revision:
          allOf:
            - $ref: "#/components/schemas/PolicyRevision"
          nullable: true
          description: 現在有効な最新公開版。未公開の場合は null
