openapi: 3.1.0
info:
  title: Arc - みらい予報 API
  version: 0.2.0
  description: 予約・決済・相談員管理 API

servers:
  - url: /api

paths:
  /customer/me:
    get:
      operationId: getCustomerMe
      summary: 顧客プロフィール取得
      tags: [customer]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerProfile"
        "404":
          description: 未登録（サインアップ前）
    patch:
      operationId: updateCustomerProfile
      summary: 顧客プロフィール更新
      tags: [customer]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName, birthDate]
              properties:
                displayName:
                  type: string
                primaryEmail:
                  type: string
                birthDate:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
    delete:
      operationId: withdrawCustomer
      summary: 顧客退会
      tags: [customer]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
  /customer/me/signup:
    post:
      operationId: signupCustomer
      summary: 顧客会員登録（匿名 / Google 連携）
      tags: [customer]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName, birthDate]
              properties:
                displayName:
                  type: string
                birthDate:
                  type: string
                primaryEmail:
                  type: string
                providerUid:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [userId, isNew]
                properties:
                  userId:
                    type: string
                  isNew:
                    type: boolean
  /customer/me/coupons:
    get:
      operationId: getCustomerCoupons
      summary: 顧客の受け取り済みクーポン一覧
      tags: [customer]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [coupons]
                properties:
                  coupons:
                    type: array
                    items:
                      $ref: "#/components/schemas/CustomerCoupon"
  /customer/me/bookings:
    get:
      operationId: getMyBookings
      summary: ログイン顧客の全予約（組織横断）
      tags: [customer]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [bookings]
                properties:
                  bookings:
                    type: array
                    items:
                      $ref: "#/components/schemas/MyBooking"
  /customer/me/bookings/{bookingId}/cancel:
    post:
      operationId: cancelMyBooking
      summary: ログイン顧客の予約キャンセル
      tags: [customer]
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
  /organizations/{organizationId}/customers/me/bookings:
    get:
      operationId: getCustomerBookings
      summary: 顧客の予約履歴取得
      tags: [customer]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [bookings]
                properties:
                  bookings:
                    type: array
                    items:
                      $ref: "#/components/schemas/CustomerBooking"
  /auth/zoom/authorize:
    post:
      operationId: createZoomAuthorizeUrl
      summary: Zoom 連携の認可 URL を発行
      tags: [customer]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
  /auth/zoom/revoke:
    post:
      operationId: revokeZoomConnection
      summary: Zoom 連携を解除
      tags: [customer]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
  /organizations/{organizationId}/consultants:
    get:
      operationId: getConsultants
      summary: 相談員一覧取得
      tags: [consultant]
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [consultants]
                properties:
                  consultants:
                    type: array
                    items:
                      $ref: "#/components/schemas/Consultant"

  /organizations/{organizationId}/slots:
    get:
      operationId: getSlots
      summary: 空き枠一覧取得
      tags: [slot]
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - name: consultantId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetSlots200"
    post:
      operationId: createSlot
      summary: 空き枠作成
      tags: [slot]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consultantId, startsAt, endsAt]
              properties:
                consultantId:
                  type: string
                startsAt:
                  type: string
                  format: date-time
                endsAt:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [slotId]
                properties:
                  slotId:
                    type: string

  /organizations/{organizationId}/slots/{slotId}:
    delete:
      operationId: deleteSlot
      summary: 空き枠削除
      tags: [slot]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/SlotIdParam"
      responses:
        "200":
          description: OK

  /organizations/{organizationId}/bookings:
    post:
      operationId: createBooking
      summary: 予約作成
      tags: [booking]
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateBookingResponse"

  /organizations/{organizationId}/bookings/{bookingId}/cancel:
    post:
      operationId: cancelBooking
      summary: 予約キャンセル
      tags: [booking]
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/BookingIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cancelledBy]
              properties:
                cancelledBy:
                  type: string
                  enum: [customer, admin]
                token:
                  type: string
                  description: "顧客キャンセル時に必須。形式: bookingId.expiresAt.signature"
      responses:
        "200":
          description: OK

  /organizations/{organizationId}/bookings/{bookingId}/setup-payment:
    post:
      operationId: setupPayment
      summary: 決済セットアップ
      tags: [booking]
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/BookingIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupPaymentRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupPaymentResponse"

  /organizations/{organizationId}/bookings/{bookingId}/charge:
    post:
      operationId: chargePayment
      summary: 手動課金
      tags: [booking]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/BookingIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method:
                  type: string
                  enum: [manual]
      responses:
        "200":
          description: OK

  /organizations/{organizationId}/price-plans:
    get:
      operationId: getPricePlans
      summary: 予約用料金プラン一覧取得（開始時刻確定前）
      tags: [booking]
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - name: consultantId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [pricePlans]
                properties:
                  pricePlans:
                    type: array
                    items:
                      $ref: "#/components/schemas/PricePlanOption"

  /organizations/{organizationId}/settings/public:
    get:
      operationId: getPublicSettings
      summary: 公開設定取得
      tags: [settings]
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSettings"

  /organizations/{organizationId}/batch/charge:
    post:
      operationId: batchCharge
      summary: バッチ課金（Cloud Scheduler）
      tags: [batch]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [chargedCount, completedCount]
                properties:
                  chargedCount:
                    type: integer
                  completedCount:
                    type: integer

  /organizations/{organizationId}/batch/consultation-reminders:
    post:
      operationId: sendConsultationReminders
      summary: 相談開始15分前リマインドメール送信（Cloud Scheduler）
      tags: [batch]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [sentCount, skippedCount]
                properties:
                  sentCount:
                    type: integer
                  skippedCount:
                    type: integer

  /organizations/{organizationId}/batch/late-arrival-alerts:
    post:
      operationId: notifyLateArrivalAlerts
      summary: 相談員遅刻予防アラート送信（Cloud Scheduler）
      tags: [batch]
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [targetCount, notifiedCount, errors]
                properties:
                  targetCount:
                    type: integer
                  notifiedCount:
                    type: integer
                  errors:
                    type: array
                    items:
                      type: object
                      required: [bookingId, error]
                      properties:
                        bookingId:
                          type: string
                        error:
                          type: string

  /organizations/{organizationId}/consultant/bookings:
    get:
      operationId: getConsultantBookings
      summary: 相談員予約一覧取得
      tags: [consultant]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - $ref: "#/components/parameters/SortByParam"
        - $ref: "#/components/parameters/SortOrderParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [bookings, pagination]
                properties:
                  bookings:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConsultantBookingDetail"
                  pagination:
                    $ref: "#/components/schemas/PaginationMeta"

  /organizations/{organizationId}/consultant/bookings/{id}/memo:
    patch:
      operationId: updateConsultantMemo
      summary: 鑑定メモ更新
      tags: [consultant]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerName, birthDate, appraisalDate, freeMemo]
              properties:
                customerName:
                  type: string
                  description: お名前
                birthDate:
                  type: string
                  description: 生年月日（YYYY-MM-DD、未入力は空文字）
                appraisalDate:
                  type: string
                  description: 鑑定日（YYYY-MM-DD、未入力は空文字）
                freeMemo:
                  type: string
                  description: フリーメモ
      responses:
        "200":
          description: OK

  /organizations/{organizationId}/consultant/bookings/{id}/join:
    post:
      operationId: joinConsultantBooking
      summary: 相談員入室確認
      tags: [consultant]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: OK

  /organizations/{organizationId}/consultant/price-plans:
    get:
      operationId: listPricePlans
      summary: 相談員料金プラン一覧取得
      tags: [consultant]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [pricePlans, pricePlanRange]
                properties:
                  pricePlans:
                    type: array
                    items:
                      $ref: "#/components/schemas/PricePlan"
                  pricePlanRange:
                    $ref: "#/components/schemas/PricePlanRange"
    post:
      operationId: createPricePlan
      summary: 相談員料金プラン作成
      tags: [consultant]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePricePlanRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricePlan"

  /organizations/{organizationId}/consultant/price-plans/{pricePlanId}:
    patch:
      operationId: updatePricePlan
      summary: 相談員料金プラン更新
      tags: [consultant]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - name: pricePlanId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePricePlanRequest"
      responses:
        "200":
          description: OK
    delete:
      operationId: archivePricePlan
      summary: 相談員料金プランアーカイブ
      tags: [consultant]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - name: pricePlanId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK

  /organizations/{organizationId}/consultant/profile:
    get:
      operationId: getConsultantProfile
      summary: 相談員プロフィール取得
      tags: [consultant]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultantProfile"
    patch:
      operationId: updateConsultantProfile
      summary: 相談員プロフィール更新
      tags: [consultant]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, specialties]
              properties:
                name:
                  type: string
                bio:
                  type: string
                phone:
                  type: string
                imageUrl:
                  type: string
                specialties:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: OK

  /organizations/{organizationId}/consultant/profile/avatar-upload-url:
    post:
      operationId: createConsultantAvatarUploadUrl
      summary: 相談員アバターアップロードURL発行
      tags: [consultant]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType, fileSize]
              properties:
                contentType:
                  type: string
                fileSize:
                  type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarUploadUrlResponse"

  /organizations/{organizationId}/consultant/profile/avatar-publish:
    post:
      operationId: publishConsultantAvatar
      summary: 相談員アバター公開
      tags: [consultant]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [objectPath]
              properties:
                objectPath:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarPublishResponse"

  /organizations/{organizationId}/console/dashboard:
    get:
      operationId: getConsoleDashboard
      summary: 管理ダッシュボード取得
      tags: [console]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardData"

  /organizations/{organizationId}/console/slots:
    get:
      operationId: getConsoleSlots
      summary: 空き枠一覧取得（管理画面）
      tags: [console]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - name: consultantId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetSlots200"

  /organizations/{organizationId}/console/consultants:
    get:
      operationId: getConsoleConsultants
      summary: 相談員一覧取得（管理者）
      tags: [console]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - $ref: "#/components/parameters/SortByParam"
        - $ref: "#/components/parameters/SortOrderParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [consultants, pagination]
                properties:
                  consultants:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConsultantDetail"
                  pagination:
                    $ref: "#/components/schemas/PaginationMeta"
    post:
      operationId: createConsoleConsultant
      summary: 相談員作成
      tags: [console]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consultantId, name]
              properties:
                consultantId:
                  type: string
                name:
                  type: string
                bio:
                  type: string
                phone:
                  type: string
                specialties:
                  type: array
                  items:
                    type: string
                statusId:
                  type: string
      responses:
        "201":
          description: Created

  /organizations/{organizationId}/console/consultants/invite:
    post:
      operationId: inviteConsultant
      summary: 相談員招待（Consultant のみ作成、accounts コレクションには書き込まない）
      tags: [console]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name]
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [consultantId]
                properties:
                  consultantId:
                    type: string

  /organizations/{organizationId}/console/consultants/{id}:
    patch:
      operationId: updateConsoleConsultant
      summary: 相談員更新
      tags: [console]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                bio:
                  type: string
                phone:
                  type: string
                specialties:
                  type: array
                  items:
                    type: string
                statusId:
                  type: string
      responses:
        "200":
          description: OK
    delete:
      operationId: deleteConsoleConsultant
      summary: 相談員無効化
      tags: [console]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: OK

  /organizations/{organizationId}/console/settings/booking:
    get:
      operationId: getConsoleBookingSettings
      summary: 予約設定取得（管理者・オペレーター）
      tags: [console]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingSettings"
    patch:
      operationId: updateConsoleBookingSettings
      summary: 予約設定更新（管理者のみ）
      tags: [console]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingSettings"
      responses:
        "200":
