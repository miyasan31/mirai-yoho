components:
  parameters:
    OrganizationIdParam:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
    BookingIdParam:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
    PolicyTypeParam:
      name: type
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PolicyType"
    PolicyRevisionIdParam:
      name: revisionId
      in: path
      required: true
      schema:
        type: string
    SlotIdParam:
      name: slotId
      in: path
      required: true
      schema:
        type: string
    AccountIdParam:
      name: accountId
      in: path
      required: true
      schema:
        type: string
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        enum: [20, 50, 100]
        default: 20
    SortByParam:
      name: sortBy
      in: query
      required: false
      schema:
        type: string
        enum: [createdAt, updatedAt]
        default: createdAt
    SortOrderParam:
      name: sortOrder
      in: query
      required: false
      schema:
        type: string
        enum: [desc]
        default: desc

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    CustomerProfile:
      type: object
      required:
        [
          userId,
          authUid,
          displayName,
          primaryEmail,
          birthDate,
          status,
          authProviders,
          hasActiveZoomConnection,
          zoomEmail,
          createdAt,
          updatedAt,
        ]
      properties:
        userId:
          type: string
        authUid:
          type: string
        displayName:
          type: string
        primaryEmail:
          type: string
          nullable: true
        birthDate:
          type: string
        status:
          type: string
          enum: [active, withdrawn]
        authProviders:
          type: array
          items:
            $ref: "#/components/schemas/CustomerAuthProviderLink"
        hasActiveZoomConnection:
          type: boolean
        zoomEmail:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
    CustomerAuthProviderLink:
      type: object
      required: [providerId, linkedAt]
      properties:
        providerId:
          type: string
        linkedAt:
          type: string
    CustomerCoupon:
      type: object
      required:
        [
          userCouponId,
          couponId,
          organizationId,
          couponName,
          amountJPY,
          type,
          receivedAt,
          expiresAt,
          redeemedAt,
          isRedeemable,
        ]
      properties:
        userCouponId:
          type: string
        couponId:
          type: string
        organizationId:
          type: string
        couponName:
          type: string
        amountJPY:
          type: integer
          minimum: 0
        type:
          $ref: "#/components/schemas/CouponType"
        receivedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        redeemedAt:
          type: string
          format: date-time
          nullable: true
        isRedeemable:
          type: boolean
    CustomerBooking:
      type: object
      required:
        [
          bookingId,
          status,
          startsAt,
          endsAt,
          durationMinutes,
          consultantId,
          joinUrl,
          pricePlanName,
          pricePlanTotalJPY,
        ]
      properties:
        bookingId:
          type: string
        status:
          type: string
          enum: [pending, confirmed, completed, cancelled]
        startsAt:
          type: string
        endsAt:
          type: string
        durationMinutes:
          type: integer
          enum: [30, 60, 90, 120]
        consultantId:
          type: string
        joinUrl:
          type: string
          nullable: true
        pricePlanName:
          type: string
          nullable: true
        pricePlanTotalJPY:
          type: number
          nullable: true
    MyBooking:
      type: object
      required:
        [
          bookingId,
          organizationId,
          status,
