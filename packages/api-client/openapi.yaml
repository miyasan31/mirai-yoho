      tags: [console]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/PolicyTypeParam"
        - name: from
          in: query
          required: false
          description: 比較元の revisionId。省略時は空文字列との差分（新規追加相当）
          schema:
            type: string
        - name: to
          in: query
          required: true
          description: 比較先の revisionId
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
